name: Renovate

on:
  schedule:
    # Taeglich 05:00 UTC, eine Stunde nach dem Lauf in kubernetes-homelab.
    # Versetzt, damit nicht zwei Laeufe gleichzeitig dasselbe RENOVATE_TOKEN
    # benutzen und ins GitHub-Rate-Limit laufen.
    #
    # Nur ein Lauf pro Tag, anders als drueben: dort braucht es zwei, weil
    # Renovate selbst merged und einen gruenen Branch sehen muss. Hier merged
    # nichts automatisch, jeder PR ist eine Notiz fuer ein spaeteres
    # "terraform apply".
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Nur analysieren, keine Branches/PRs anlegen'
        type: boolean
        default: false
      logLevel:
        description: 'Log-Level'
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.2.0
        with:
          # Fine-grained PAT als Repo-Secret RENOVATE_TOKEN. Noetige
          # Permissions: Contents RW, Pull requests RW, Issues RW (Dependency
          # Dashboard), Workflows RW (sonst blocken Action-Updates), Commit
          # statuses RW. Der Default-GITHUB_TOKEN reicht nicht.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Die Action erwartet fuer "aus" den String "null", nicht leer.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
