# Unbound as the recursive upstream for the LXC instance of Blocky.
#
# The same configuration as the sidecar in the cluster
# (kubernetes-homelab/manifests/blocky/unbound.conf) as far as resolution
# goes. A separate file because the Alpine package uses different paths than
# the container image: /var/lib/unbound instead of /usr/local/unbound, and
# root.key and root.zone are created by Unbound itself here rather than
# shipped in the image.
#
# Changes that affect resolution belong in BOTH files. Anything that is only
# about paths or permissions stays here.

server:
  verbosity: 1
  num-threads: 2

  # Only Blocky on the same host talks to Unbound.
  interface: 127.0.0.1@5335
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 refuse

  # No v6 transport to the authoritative servers. Unlike the sidecar in the
  # cluster this is a decision here and not a constraint: the container hangs
  # off vmbr0 and receives an ISP GUA and a v6 default route via RA on top of
  # its static ULA, so v6 to the outside would work.
  #
  # Two reasons to leave it off anyway. The ISP prefix rotates every few days,
  # so outgoing v6 connections regularly end up on a deprecated source
  # address. And both Blocky instances should fetch the same answers over the
  # same paths: if one goes over v6 and the other does not, "works on .254,
  # hangs on .253" stops being a coincidence and becomes designed in.
  #
  # Nothing is lost by it. Authoritative nameservers reachable over v6 only
  # do not exist in practice.
  do-ip4: yes
  do-ip6: no
  prefer-ip4: yes
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes
  udp-connect: yes

  outgoing-range: 4096
  outgoing-port-permit: 32768
  num-queries-per-thread: 2048

  # Do NOT drop these. Alpine builds Unbound with a default of 4 MB for these
  # buffers, which the kernel does not grant in an unprivileged container.
  # Unbound then writes two warnings to stderr at startup, and at boot time
  # there is no console attached: the process dies before it listens. It shows
  # up as "status: crashed" without any error message, while starting it by
  # hand works perfectly.
  #
  # 0 means "take the system value" and makes the warning moot.
  so-sndbuf: 0
  so-rcvbuf: 0

  msg-cache-size: 32m
  msg-cache-slabs: 4
  rrset-cache-size: 64m
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-size: 8m
  key-cache-slabs: 4
  neg-cache-size: 2m
  cache-min-ttl: 0
  cache-max-ttl: 86400
  prefetch: yes
  prefetch-key: yes
  serve-expired: no

  username: "unbound"
  directory: "/etc/unbound"
  chroot: ""
  logfile: ""
  use-syslog: yes
  log-time-ascii: yes
  log-servfail: yes
  pidfile: "/run/unbound.pid"

  hide-identity: yes
  hide-version: yes
  hide-trustanchor: yes
  harden-short-bufsize: yes
  harden-large-queries: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-algo-downgrade: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  use-caps-for-id: no
  deny-any: yes
  rrset-roundrobin: yes
  minimal-responses: yes
  disable-dnssec-lame-check: no
  do-not-query-localhost: yes

  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  # plex.direct maps LAN addresses into public DNS by design (Plex hands out
  # per-server certificates for them), so it has to be exempt from the filter.
  private-domain: "plex.direct"
  unblock-lan-zones: no
  insecure-lan-zones: yes

  # Without root-hints Unbound uses the compiled-in root server addresses. The
  # Alpine package ships no hints file, and the compiled-in list is a more
  # reliable source than one nobody updates.
  module-config: "validator iterator"
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  trust-anchor-signaling: yes
  root-key-sentinel: yes
  val-max-restart: 5
  val-clean-additional: yes
  val-permissive-mode: no
  val-log-level: 2
  ignore-cd-flag: no
  zonemd-permissive-mode: no

# Local copy of the root zone via zone transfer (RFC 8806). fallback-enabled:
# yes means Unbound recurses normally when the transfer fails, rather than
# coming to a halt.
auth-zone:
  name: "."
  primary: 170.247.170.2        # b.root-servers.net
  primary: 192.33.4.12          # c.root-servers.net
  primary: 199.7.91.13          # d.root-servers.net
  primary: 192.5.5.241          # f.root-servers.net
  primary: 192.112.36.4         # g.root-servers.net
  primary: 193.0.14.129         # k.root-servers.net
  primary: 192.0.47.132         # xfr.cjr.dns.icann.org
  primary: 192.0.32.132         # xfr.lax.dns.icann.org
  fallback-enabled: yes
  for-downstream: no
  for-upstream: yes
  zonemd-check: yes
  zonemd-reject-absence: no
  zonefile: "/var/lib/unbound/root.zone"
