# Unbound als rekursiver Upstream fuer die LXC-Instanz von Blocky.
#
# Inhaltlich dieselbe Konfiguration wie der Sidecar im Cluster
# (kubernetes-homelab/manifests/blocky/unbound.conf). Getrennte Datei, weil das
# Alpine-Paket andere Pfade benutzt als das Container-Image: /var/lib/unbound
# statt /usr/local/unbound, und root.key sowie root.zone legt Unbound hier
# selbst an, statt sie aus dem Image mitzubringen.
#
# Aenderungen, die die Aufloesung betreffen, gehoeren in BEIDE Dateien. Was nur
# Pfade oder Rechte betrifft, bleibt hier.

server:
  verbosity: 1
  num-threads: 2

  # Nur Blocky auf demselben Host redet mit Unbound.
  interface: 127.0.0.1@5335
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 refuse

  # Kein v6-Transport zu den Autoritativen. Anders als beim Sidecar im Cluster
  # ist das hier eine Entscheidung und kein Zwang: der Container haengt an
  # vmbr0 und bekommt per RA zusaetzlich zu seiner statischen ULA eine
  # ISP-GUA und eine v6-Default-Route, v6 nach draussen wuerde also gehen.
  #
  # Zwei Gruende, es trotzdem zu lassen. Der ISP-Praefix rotiert alle paar
  # Tage, ausgehende v6-Verbindungen laufen also regelmaessig auf eine
  # deprecated Quelladresse. Und beide Blocky-Instanzen sollen dieselben
  # Antworten auf denselben Wegen holen: laeuft eine ueber v6 und die andere
  # nicht, ist "geht auf .254, haengt auf .253" kein Zufall mehr, sondern
  # eingebaut.
  #
  # Zu verlieren ist dabei nichts. Autoritative Nameserver, die nur ueber v6
  # erreichbar sind, gibt es praktisch nicht.
  do-ip4: yes
  do-ip6: no
  prefer-ip4: yes
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes
  udp-connect: yes

  outgoing-range: 4096
  outgoing-port-permit: 32768
  num-queries-per-thread: 2048

  # NICHT weglassen. Alpine baut Unbound mit einem Vorgabewert von 4 MB fuer
  # diese Puffer, den der Kernel im unprivilegierten Container nicht gewaehrt.
  # Unbound schreibt daraufhin beim Start zwei Warnungen nach stderr, und beim
  # Boot haengt dort keine Konsole: der Prozess stirbt, bevor er lauscht.
  # Sichtbar wird das als "status: crashed" ohne jede Fehlermeldung, waehrend
  # ein Start von Hand einwandfrei funktioniert.
  #
  # 0 bedeutet "Systemwert nehmen" und macht die Warnung gegenstandslos.
  so-sndbuf: 0
  so-rcvbuf: 0

  msg-cache-size: 32m
  msg-cache-slabs: 4
  rrset-cache-size: 64m
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-size: 8m
  key-cache-slabs: 4
  neg-cache-size: 2m
  cache-min-ttl: 0
  cache-max-ttl: 86400
  prefetch: yes
  prefetch-key: yes
  serve-expired: no

  username: "unbound"
  directory: "/etc/unbound"
  chroot: ""
  logfile: ""
  use-syslog: yes
  log-time-ascii: yes
  log-servfail: yes
  pidfile: "/run/unbound.pid"

  hide-identity: yes
  hide-version: yes
  hide-trustanchor: yes
  harden-short-bufsize: yes
  harden-large-queries: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-algo-downgrade: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  use-caps-for-id: no
  deny-any: yes
  rrset-roundrobin: yes
  minimal-responses: yes
  disable-dnssec-lame-check: no
  do-not-query-localhost: yes

  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  # plex.direct bildet LAN-Adressen absichtlich im oeffentlichen DNS ab (Plex
  # stellt dafuer eigene Zertifikate aus), muss also vom Filter ausgenommen sein.
  private-domain: "plex.direct"
  unblock-lan-zones: no
  insecure-lan-zones: yes

  # Ohne root-hints nimmt Unbound die einkompilierten Root-Server-Adressen. Das
  # Alpine-Paket bringt keine Hints-Datei mit, die einkompilierte Liste ist die
  # verlaesslichere Quelle als eine, die niemand aktualisiert.
  module-config: "validator iterator"
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  trust-anchor-signaling: yes
  root-key-sentinel: yes
  val-max-restart: 5
  val-clean-additional: yes
  val-permissive-mode: no
  val-log-level: 2
  ignore-cd-flag: no
  zonemd-permissive-mode: no

# Lokale Kopie der Root-Zone per Zonentransfer (RFC 8806). fallback-enabled: yes
# bedeutet, dass Unbound bei gescheitertem Transfer normal rekursiert, statt
# stehen zu bleiben.
auth-zone:
  name: "."
  primary: 170.247.170.2        # b.root-servers.net
  primary: 192.33.4.12          # c.root-servers.net
  primary: 199.7.91.13          # d.root-servers.net
  primary: 192.5.5.241          # f.root-servers.net
  primary: 192.112.36.4         # g.root-servers.net
  primary: 193.0.14.129         # k.root-servers.net
  primary: 192.0.47.132         # xfr.cjr.dns.icann.org
  primary: 192.0.32.132         # xfr.lax.dns.icann.org
  fallback-enabled: yes
  for-downstream: no
  for-upstream: yes
  zonemd-check: yes
  zonemd-reject-absence: no
  zonefile: "/var/lib/unbound/root.zone"
